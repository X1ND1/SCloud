[package]
name = "scloud"
version = "0.2.0"
edition = "2021"
description = "A native SoundCloud desktop client for Windows (egui + libmpv)"
license = "MIT"
repository = "https://github.com/X1ND1/SCloud"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libmpv2 = "4"
dirs = "5"
rfd = "0.15"
sys-locale = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
# icon for scloud.exe (Explorer, shortcuts, taskbar)
winresource = "0.1"

# SoundCloud sign-in window (Edge WebView2, built into Windows 10/11)
[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"
# animated taskbar icon (WM_SETICON)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
# media keys and the Windows media overlay with cover art (SMTC)
souvlaki = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
