# Builds the installer on GitHub: push a vX.Y.Z tag (or press "Run workflow")
# and the release gets SCloud-Setup-X.Y.Z.exe attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build app and installer
        shell: pwsh
        run: ./build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SCloud-Setup
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
